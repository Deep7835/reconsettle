name: settleops

services:
  backend:
    build:
      context: ./backend
    image: settleops/backend:latest
    container_name: settleops-backend
    restart: unless-stopped
    environment:
      # --- DB ---
      DATABASE_URL: ${DATABASE_URL:-sqlite:////app/data/settleops.db}

      # --- CORS ---
      # Allow the frontend nginx (same compose network) + your prod domain
      CORS_ORIGINS: ${CORS_ORIGINS:-http://localhost,http://frontend}

      # --- Business rules ---
      CHARGE_RATE: ${CHARGE_RATE:-0.41}
      DEFAULT_GST_RATE: ${DEFAULT_GST_RATE:-0}

      # --- Auth (single user) ---
      SEED_USERNAME: ${SEED_USERNAME:-deep7835}
      SEED_PASSWORD: ${SEED_PASSWORD:-Deep@1234-=}
      # SET THIS for stable tokens across container restarts (otherwise auto-generated, invalidates sessions on restart)
      JWT_SECRET: ${JWT_SECRET:-}
      JWT_EXPIRES_HOURS: ${JWT_EXPIRES_HOURS:-168}

      # --- Gmail ---
      GMAIL_SEARCH_QUERY: ${GMAIL_SEARCH_QUERY:-from:bank has:attachment newer_than:7d}
      GMAIL_SYNC_INTERVAL_MINUTES: ${GMAIL_SYNC_INTERVAL_MINUTES:-30}

      # --- Telegram ---
      TELEGRAM_BOT_TOKEN: ${TELEGRAM_BOT_TOKEN:-}
      TELEGRAM_REPORT_CHAT_ID: ${TELEGRAM_REPORT_CHAT_ID:-}
      TELEGRAM_INBOUND_CHAT_IDS: ${TELEGRAM_INBOUND_CHAT_IDS:-}
      TELEGRAM_SYNC_INTERVAL_MINUTES: ${TELEGRAM_SYNC_INTERVAL_MINUTES:-10}
      TELEGRAM_DIGEST_CRON: ${TELEGRAM_DIGEST_CRON:-}

      # --- App ---
      APP_LOG_LEVEL: ${APP_LOG_LEVEL:-info}
    volumes:
      - backend_data:/app/data        # SQLite + telegram_state.json
      - backend_secrets:/app/secrets  # Gmail credentials.json + token.json
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:8000/api/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
    networks:
      - settleops

  frontend:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        # Empty = same-origin; nginx proxies /api/* to the backend service
        VITE_API_BASE: ""
    image: settleops/frontend:latest
    container_name: settleops-frontend
    restart: unless-stopped
    ports:
      - "${HOST_PORT:-80}:80"
    environment:
      # Override at runtime if your backend lives elsewhere
      BACKEND_HOST: ${BACKEND_HOST:-backend:8000}
    depends_on:
      backend:
        condition: service_healthy
    networks:
      - settleops

networks:
  settleops:
    driver: bridge

volumes:
  backend_data:
  backend_secrets:
